<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#c47a3a" />
  <title>Ashvault</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="view"></canvas>
    <div id="hud" class="hide">
      <div class="bar-row">
        <div class="pip" id="hpBar"><i></i></div>
        <div class="pip stam" id="stBar"><i></i></div>
        <div class="chip" id="floorChip">HEARTH</div>
      </div>
      <div class="bar-row" style="top:28px">
        <span class="meta" id="runMeta"></span>
      </div>
      <div id="prompt"></div>
      <div id="toast"></div>
    </div>
    <div id="controls" class="hide">
      <div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div>
      <div class="btn-col">
        <button class="act" id="btnSkill" type="button">BRAND</button>
        <button class="act" id="btnAtk" type="button">STRIKE</button>
        <button class="act" id="btnDash" type="button">DASH</button>
        <button class="act" id="btnInv" type="button">PACK</button>
        <button class="act wide" id="btnUse" type="button">USE</button>
      </div>
    </div>
    <div id="overlay" class="hide"></div>
    <div id="boot">
      <h1>ASHVAULT</h1>
      <p class="sub">The Hearth is the last dry room. Rifts open onto dead industries. What you lock in the Safe Pouch comes home even if the gate closes on your bones.</p>
      <div class="row">
        <button class="solid" id="btnStart" type="button">Enter the Hearth</button>
        <button class="ghost" id="btnWipe" type="button">Wipe save</button>
      </div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/save.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/world.js"></script>
  <script src="js/home.js"></script>
  <script src="js/run.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
